name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Keep in step with TABLES_PROBED_FROM in test/helpers/compiler.ts
      TASS_VERSION: 1.60.3243
    environment: vs marketplace publishing
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # This project uses yarn. yarn.lock is gitignored, so a release resolves
      # transitive dependencies fresh - the tests below are what gate it.
      - name: Install dependencies
        run: yarn install

      - name: Typecheck
        run: yarn typecheck

      # Build the exact 64tass the opcode tables were probed from. The apt
      # package is older (Ubuntu 24.04 ships 1.59.3120) and lacks mnemonics this
      # project's fixtures use, and testing the generated tables against a
      # different assembler verifies nothing - so the version is pinned here and
      # asserted. Takes about three seconds.
      - name: Build 64tass ${{ env.TASS_VERSION }}
        env:
          TASS_VERSION: ${{ env.TASS_VERSION }}
        run: |
          set -euo pipefail
          curl -sSL --retry 3 -o /tmp/64tass-src.zip \
            "https://sourceforge.net/projects/tass64/files/source/64tass-${TASS_VERSION}-src.zip/download"
          unzip -q /tmp/64tass-src.zip -d /tmp/64tass-src
          make -C "/tmp/64tass-src/64tass-${TASS_VERSION}-src" -j"$(nproc)"
          sudo install "/tmp/64tass-src/64tass-${TASS_VERSION}-src/64tass" /usr/local/bin/64tass
          64tass --version
          64tass --version | grep -q "V${TASS_VERSION}$" \
            || { echo "::error::64tass is not V${TASS_VERSION}"; exit 1; }

      # Gate the release on the suite: a tag should not publish a broken build.
      # REQUIRE_TASS so the integration suites cannot silently skip here either.
      # REQUIRE_TASS turns a missing or wrong-version assembler into a failure
      # rather than a silent skip, so a green run cannot mean "verified nothing".
      - name: Test
        run: yarn test
        env:
          TASS_PATH: /usr/local/bin/64tass
          REQUIRE_TASS: '1'

      - name: Build (production)
        run: yarn compile:prod

      - name: Package extension
        run: npx vsce package --no-yarn

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: '*.vsix'
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Code Marketplace
        if: ${{ vars.PUBLISH_TO_MARKETPLACE == 'true' }}
        run: npx vsce publish --no-yarn --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
