name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    environment: vs marketplace publishing
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: yarn

      # This project uses yarn: npm install would ignore yarn.lock and resolve
      # transitive dependencies fresh, so a release could ship versions that were
      # never tested. --frozen-lockfile fails instead of silently updating.
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      # Gate the release on the suite: a tag should not publish a broken build
      - name: Test
        run: yarn test

      - name: Build (production)
        run: yarn compile:prod

      - name: Package extension
        run: npx vsce package --no-yarn

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: '*.vsix'
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Code Marketplace
        if: ${{ vars.PUBLISH_TO_MARKETPLACE == 'true' }}
        run: npx vsce publish --no-yarn --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
