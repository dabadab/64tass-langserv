name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    environment: vs marketplace publishing
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # This project uses yarn. yarn.lock is gitignored, so a release resolves
      # transitive dependencies fresh - the tests below are what gate it.
      - name: Install dependencies
        run: yarn install

      - name: Typecheck
        run: yarn typecheck

      - name: Install 64tass
        run: sudo apt-get update && sudo apt-get install -y 64tass

      # Gate the release on the suite: a tag should not publish a broken build.
      # REQUIRE_TASS so the integration suites cannot silently skip here either.
      - name: Test
        run: yarn test
        env:
          TASS_PATH: /usr/bin/64tass
          REQUIRE_TASS: '1'

      - name: Build (production)
        run: yarn compile:prod

      - name: Package extension
        run: npx vsce package --no-yarn

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: '*.vsix'
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Code Marketplace
        if: ${{ vars.PUBLISH_TO_MARKETPLACE == 'true' }}
        run: npx vsce publish --no-yarn --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
