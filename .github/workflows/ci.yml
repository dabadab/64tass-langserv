name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # yarn.lock is gitignored in this repo, so there is nothing to cache against
      # and nothing to freeze: dependencies are resolved fresh on every run.
      - name: Install dependencies
        run: yarn install

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      # The integration suites compare this extension's behaviour against the real
      # assembler. Without it they skip silently, so a green CI run would be
      # verifying nothing about 64tass compatibility - REQUIRE_TASS makes a missing
      # binary a hard failure instead.
      - name: Install 64tass
        run: sudo apt-get update && sudo apt-get install -y 64tass

      - name: Test
        run: yarn test
        env:
          TASS_PATH: /usr/bin/64tass
          REQUIRE_TASS: '1'

      - name: Build
        run: yarn compile
